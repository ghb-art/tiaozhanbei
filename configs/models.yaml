config_version: "0.1-dev"
frozen_for_final_gate: false

models:
  cloud_teacher:
    role: cloud_teacher
    model_id: "Qwen/Qwen2.5-14B-Instruct-AWQ"
    serving_backend: vllm
    endpoint: "http://localhost:8000"
    purpose: "G1 denominator, teacher trace generation, cloud correction."

  edge_student:
    role: low_edge_recovery_candidate
    model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    target_name: "DB4AI-Edge-P0A2-DeepSeek-1.5B-Q2"
    quant_format: "Q2_K_S"
    serving_backend: llama_cpp
    status: recovery_in_progress_not_promoted
    purpose: "Only active edge route. The recovered and requantized model must pass G1 and G3 before system integration."

training:
  seed: 42
  adapter_method: lora
  output_root: "models"

artifacts:
  recovery_adapter_dir: "models/adapters/p0a2_deepseek_recovery"
  recovery_merged_dir: "models/checkpoints/p0a2-deepseek-recovery-merged"
  recovery_quantized_model: "models/quantized/p0a2-deepseek-recovery-q2_k_s.gguf"
  quantized_model_dir: "models/quantized"
